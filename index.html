<!DOCTYPE html>
<html lang="id">
<head>

<body class="bg-brand-50 font-sans text-slate-800 antialiased h-screen overflow-hidden flex justify-center items-center p-0 sm:p-2 md:p-4">

        <div class="bg-white w-full max-w-md rounded-3xl p-6 md:p-8 shadow-2xl border border-brand-100 text-center">
            <div class="w-16 h-16 bg-brand-600 text-white rounded-2xl flex items-center justify-center font-bold text-2xl mx-auto mb-4 shadow-lg shadow-brand-200">
                P5
            </div>
            <h2 class="text-2xl font-bold text-slate-800">PRMOFIVE CHAT</h2>
            <p class="text-sm text-slate-500 mt-1 mb-6">Masukan nama & atur foto profil Anda untuk mulai obrolan real-time.</p>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div class="text-left">
                    <label class="text-xs font-semibold text-slate-600 ml-1">Nama Tampilan</label>
                    <input type="text" id="username-input" required placeholder="Contoh: Alex, Budi, Sarah" class="w-full mt-1 px-4 py-3 bg-brand-50/60 border border-brand-200 rounded-xl text-sm focus:outline-none focus:border-brand-500 focus:bg-white transition">
                </div>

                <div class="text-left">
                    <label class="text-xs font-semibold text-slate-600 ml-1">Foto Profil (Avatar / File)</label>
                    <div class="flex items-center gap-3 mt-2">

                        <div class="flex-1 space-y-2" 
                            <input type="file" id="login-avatar-file" accept="image/*" onchange="handleLoginAvatarFile(event)" class="text-xs text-slate-500 w-full file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-brand-100 file:text-brand-700 hover:file:bg-brand-200 cursor-pointer">
                        </div>
                    </div>
                    <p class="text-[11px] text-slate-400 mt-1">Pilih preset di bawah atau unggah foto Anda sendiri.</p>
                    <div class="flex gap-3 mt-2 justify-center" id="avatar-selector">
